name: Scheduled Script Execution

on:
  schedule:
    # Run every working day at 12:00 y 19:00 UTC (9:00 y 16:00 AR)
    - cron: '0 11,12,13,18,19,20 * * 1-5'
    # Run tuesday and thursday at 12:00 y 19:00 UTC (9:00 y 16:00 AR)
    #- cron: '0 12,19 * * 2,4'
  workflow_dispatch:  # Allow manual trigger

jobs:
  run-scheduler:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Create .env file from GitHub Secrets
      run: |
        echo "TIME_ZONE=${{ vars.TIME_ZONE }}" >> .env
        echo "INTERVAL_SECONDS=${{ vars.INTERVAL_SECONDS }}" >> .env
        echo "TIME_ROUNDING_MINUTES=${{ vars.TIME_ROUNDING_MINUTES }}" >> .env
        echo "APPRISE_URL=${{ secrets.APPRISE_URL }}" >> .env

    - name: Run RisePyMinder scheduler
      #env:
      #  TZ: UTC
      run: |
        python main.py

    - name: Upload logs on failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: scheduler-logs
        path: logs/
        retention-days: 7

    - name: Notify on failure
      if: failure()
      uses: actions/github-script@v7
      with:
        script: |
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: '❌ Scheduled RisePyMinder execution failed. Check the workflow logs for details.'
          })
