[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "RisePyMinder"
version = "1.0.0"
description = "Scheduled notification system"
readme = "README.md"
license = { text = "GPL-3.0-or-later" }
requires-python = ">=3.8"
authors = [
    {name = "Ariel", email = "arielx@unarix.com.ar"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Education",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Communications",
    "Topic :: Office/Business",
]
keywords = ["notifications", "scheduler", "apprise"]
dependencies = [
    "apprise>=1.8.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "flake8>=6.0.0",
    "mypy>=1.0.0",
]

[project.urls]
Homepage = "https://github.com/4r13lx/RisePyMinder"
Documentation = "https://github.com/4r13lx/RisePyMinder#readme"
Repository = "https://github.com/4r13lx/RisePyMinder/RisePyMinder.git"
Issues = "https://github.com/4r13lx/RisePyMinder/issues"

[tool.black]
line-length = 100
target-version = ['py38']

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "--verbose --cov=scheduler --cov-report=html"

[tool.setuptools.packages.find]
include = ["scheduler*"]

[tool.setuptools.package-data]
scheduler = ["../data/*.json"]
